<!DOCTYPE html>
<html>
  <body style="font-family: sans-serif; font-size: 13px">
    <script>
      // The label tells us which embedding context this frame was loaded in
      const label = new URLSearchParams(location.search).get('label') || 'unknown';
      localStorage.setItem('written_by', label);
      localStorage.setItem('iframe_status', 'active');
      console.log("sample loc", Object.entries(localStorage))

      document.body.innerHTML =
        '<b>' + location.origin + '</b><br>' +
        'context: ' + label + '<br>' +
        'keys visible here: ' + JSON.stringify(Object.keys(localStorage));
    </script>
  </body>
</html>
